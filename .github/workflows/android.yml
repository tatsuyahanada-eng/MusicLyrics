name: Build Store ID Tool APK

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "store-id-tool/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store-id-tool
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-id-tool-debug
          path: store-id-tool/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a Release (direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: store-id-tool-latest
          name: 店舗IDツール (latest debug)
          body: |
            最新の debug APK です。下の `app-debug.apk` を端末でダウンロードしてインストールしてください。
            （設定で「提供元不明のアプリ / このソースを許可」を有効にする必要があります）

            操作マニュアル（PDF）: `WirelessApp_Manual.pdf`
          files: |
            store-id-tool/app/build/outputs/apk/debug/app-debug.apk
            store-id-tool/docs/WirelessApp_Manual.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
