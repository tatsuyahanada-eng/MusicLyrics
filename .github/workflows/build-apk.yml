name: Build Android APK

on:
  push:
    branches:
      - claude/modest-wright-059qy2
    paths:
      - 'fx_signal_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fx_signal_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx-signal-debug-apk
          path: fx_signal_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/fx-signal.apk

      - name: Publish APK to a Release (no login needed to download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FXシグナル 最新APK
          body: |
            最新のデバッグAPKです。下の `fx-signal.apk` をタップしてダウンロードし、
            Android端末でインストールしてください（「不明なアプリのインストール」を許可）。

            コミット: ${{ github.sha }}
          files: fx_signal_app/build/app/outputs/flutter-apk/fx-signal.apk
          make_latest: true
