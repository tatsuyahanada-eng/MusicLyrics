name: Build TubeVault APK

on:
  push:
    branches:
      - "claude/youtube-download-app-pkvbjq"
    paths:
      - "tubevault/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: tubevault
        run: chmod +x gradlew

      - name: Build debug APKs
        working-directory: tubevault
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List outputs
        if: always()
        working-directory: tubevault
        run: ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tubevault-debug-apk
          path: tubevault/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
