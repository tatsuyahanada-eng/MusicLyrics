name: Build Android APK

# 音声文字起こしアプリ(VoiceTranscriber)の APK を GitHub 上でビルドします。
# - どのブランチへの push でもビルドし、APK を Artifact として添付（Actions の実行ページからダウンロード可）
# - vX.Y.Z タグを push すると Release を作成し、APK をダウンロード用に添付
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write # タグ push 時に Release を作成するため

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VoiceTranscriber
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with dependency/build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: VoiceTranscriber
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk voice-transcriber.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-transcriber-apk
          path: VoiceTranscriber/voice-transcriber.apk
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VoiceTranscriber/voice-transcriber.apk
