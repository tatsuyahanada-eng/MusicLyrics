name: Build YD APK

on:
  push:
    branches:
      - "claude/youtube-download-app-pkvbjq"
    paths:
      - "tubevault/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

# Needed to publish the APKs as release assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      QUICKJS_VERSION: v0.16.2
      NDK_VERSION: r27d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # cache-read-only defaults to true on every branch except the
      # repository's default one, and this workflow only ever runs on the
      # development branch — which left the cache never written, so every
      # build re-downloaded every dependency and recompiled from cold.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        working-directory: tubevault
        run: chmod +x gradlew

      # The binary only changes when QuickJS or the NDK does, so it is keyed
      # on both and rebuilt on neither otherwise. A hit also makes the NDK
      # itself unnecessary, which is the more expensive half to set up.
      - name: Restore the QuickJS runtime
        id: qjs-cache
        uses: actions/cache@v4
        with:
          path: tubevault/app/src/main/jniLibs
          key: qjs-${{ env.QUICKJS_VERSION }}-ndk-${{ env.NDK_VERSION }}-arm64-v8a-armeabi-v7a

      - name: Set up Android NDK
        id: setup-ndk
        if: steps.qjs-cache.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      # yt-dlp's nsig ("n challenge") solver now requires an external
      # JavaScript runtime binary (deno/node/bun/quickjs) — none of which
      # exist on Android by default. QuickJS is the smallest of the four, so
      # its CLI is cross-compiled here and bundled the same way youtubedl-
      # android already bundles ffmpeg: named "lib*.so" under jniLibs/<abi>/,
      # which makes Android install it with execute permission for free.
      - name: Build the QuickJS runtime for Android
        if: steps.qjs-cache.outputs.cache-hit != 'true'
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eu
          git clone --depth 1 --branch "$QUICKJS_VERSION" https://github.com/quickjs-ng/quickjs.git /tmp/quickjs-ng
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S /tmp/quickjs-ng -B "/tmp/qjs-build-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "/tmp/qjs-build-$abi" --target qjs_exe --parallel
            mkdir -p "tubevault/app/src/main/jniLibs/$abi"
            cp "/tmp/qjs-build-$abi/qjs" "tubevault/app/src/main/jniLibs/$abi/libqjs.so"
          done
          ls -lh tubevault/app/src/main/jniLibs/*/libqjs.so

      # A cache that restored empty or half-written would otherwise sail
      # through and ship an APK with no JS runtime — which does not fail the
      # build, it just silently breaks downloads again at nsig time.
      - name: Check the QuickJS runtime is present
        run: |
          set -eu
          for abi in arm64-v8a armeabi-v7a; do
            so="tubevault/app/src/main/jniLibs/$abi/libqjs.so"
            test -s "$so" || { echo "missing or empty: $so" >&2; exit 1; }
          done
          ls -lh tubevault/app/src/main/jniLibs/*/libqjs.so

      - name: Build debug APKs
        working-directory: tubevault
        # buildNumber becomes versionCode, so each release install replaces
        # the last one instead of tying at the same version.
        # No --no-daemon: it defeats the Gradle state the cache above keeps.
        run: ./gradlew assembleDebug -PbuildNumber="${{ github.run_number }}" --stacktrace

      - name: Name the APKs
        working-directory: tubevault/app/build/outputs/apk/debug
        run: |
          set -eu
          for f in *.apk; do
            case "$f" in
              *arm64-v8a*)   mv -f "$f" yd-arm64-v8a.apk ;;
              *armeabi-v7a*) mv -f "$f" yd-armeabi-v7a.apk ;;
            esac
          done
          ls -lh yd-*.apk

      - name: Upload APKs as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: yd-apk
          path: tubevault/app/build/outputs/apk/debug/yd-*.apk
          if-no-files-found: error
          retention-days: 30

      # Release assets download as plain .apk files — an Actions artifact is
      # always served as a zip, which a phone cannot install directly.
      - name: Publish APKs to the rolling release
        working-directory: tubevault/app/build/outputs/apk/debug
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: yd-latest
        run: |
          set -eu
          notes=$(cat <<'EOF'
          個人利用向けのビルドです。スマホでリンクをタップすると .apk が直接ダウンロードされます。

          - **yd-arm64-v8a.apk** — ここ8年ほどの端末はこちら
          - **yd-armeabi-v7a.apk** — 32bit 端末用

          デバッグ署名です。インストール時は「提供元不明のアプリ」の許可が必要です。
          動画が取得できなくなったら、設定タブの「yt-dlp を更新」を先に試してください。
          EOF
          )
          notes="${notes}

          Build: ${GITHUB_SHA}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "YD (latest build)" \
              --notes "$notes"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" yd-*.apk --clobber

          echo "### APK ダウンロード" >> "$GITHUB_STEP_SUMMARY"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          echo "- [yd-arm64-v8a.apk](${base}/yd-arm64-v8a.apk)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [yd-armeabi-v7a.apk](${base}/yd-armeabi-v7a.apk)" >> "$GITHUB_STEP_SUMMARY"
