    <text x="12"  y="75">AI副業収入: +¥38,000/月</text>
    <text x="12"  y="105">processing... 97% complete</text>
    <text x="12"  y="580">output: thumbnail_v3_final.png</text>
    <text x="12"  y="610">$ upload --platform youtube</text>
    <text x="12"  y="640">✓ 3 thumbnails completed today</text>
    <text x="920" y="600">$ ai-design --batch 5</text>
    <text x="920" y="630">render complete: 00:03:12</text>
    <text x="920" y="658">earning_per_hour: ¥4,200</text>
  </g>

