<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Case By Case — ツリーでマニュアルにたどり着く">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2e3e"/>
      <stop offset="100%" stop-color="#061019"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2836"/>
      <stop offset="100%" stop-color="#0a2130"/>
    </linearGradient>
    <linearGradient id="chosen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ff7f7"/>
      <stop offset="100%" stop-color="#3fe0e0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#3fe0e0" stroke-opacity="0.22" stroke-width="2"/>

  <!-- ===== destination: manual document ===== -->
  <g>
    <!-- soft glow behind doc to mark it as the goal -->
    <rect x="238" y="120" width="196" height="276" rx="20" fill="#3fe0e0" opacity="0.10"/>
    <!-- sheet with folded corner -->
    <path d="M238 148 a20 20 0 0 1 20-20 h116 l58 58 v170 a20 20 0 0 1-20 20 H258 a20 20 0 0 1-20-20 Z"
          fill="url(#doc)" stroke="url(#chosen)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M374 128 v38 a20 20 0 0 0 20 20 h38" fill="none" stroke="url(#chosen)" stroke-width="7" stroke-linejoin="round"/>
    <!-- title bar + text lines (the manual content) -->
    <rect x="272" y="212" width="104" height="16" rx="8" fill="#7ff7f7"/>
    <rect x="272" y="248" width="128" height="12" rx="6" fill="#3fe0e0" opacity="0.75"/>
    <rect x="272" y="278" width="128" height="12" rx="6" fill="#3fe0e0" opacity="0.55"/>
    <rect x="272" y="308" width="96"  height="12" rx="6" fill="#3fe0e0" opacity="0.55"/>
  </g>

  <!-- ===== the tree that leads to it ===== -->
  <!-- dim (unchosen) branch -->
  <g fill="none" stroke="#3fe0e0" stroke-width="12" stroke-linecap="round" opacity="0.4">
    <path d="M96 262 V330 h60"/>
  </g>
  <circle cx="168" cy="330" r="16" fill="#061019" stroke="#3fe0e0" stroke-width="10" opacity="0.4"/>

  <!-- chosen path: root -> up -> into the manual -->
  <path d="M96 262 V190 h150" fill="none" stroke="url(#chosen)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- arrow head entering the doc -->
  <path d="M238 190 l-26 -15 v30 z" fill="#7ff7f7" filter="url(#glow)"/>

  <!-- root node (the starting question) -->
  <circle cx="96" cy="288" r="30" fill="#061019" stroke="url(#chosen)" stroke-width="12" filter="url(#glow)"/>
  <circle cx="96" cy="288" r="11" fill="#7ff7f7"/>
  <!-- upper junction node on the chosen path -->
  <circle cx="96" cy="190" r="14" fill="#7ff7f7"/>
</svg>
