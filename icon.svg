<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Rounded gradient background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Equalizer bars (subtle, background) -->
  <g fill="#ffffff" opacity="0.42">
    <rect x="62"  y="208" width="22" height="96"  rx="11"/>
    <rect x="96"  y="170" width="22" height="172" rx="11"/>
    <rect x="130" y="226" width="22" height="60"  rx="11"/>
    <rect x="360" y="170" width="22" height="172" rx="11"/>
    <rect x="394" y="208" width="22" height="96"  rx="11"/>
    <rect x="428" y="226" width="22" height="60"  rx="11"/>
  </g>

  <!-- Centre play disc -->
  <circle cx="256" cy="256" r="128" fill="#000" opacity="0.22" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="124" fill="#ffffff"/>

  <!-- Inner ring (vinyl feel) -->
  <circle cx="256" cy="256" r="124" fill="none" stroke="rgba(124,58,237,0.18)" stroke-width="2"/>
  <circle cx="256" cy="256" r="18"  fill="rgba(124,58,237,0.18)"/>

  <!-- Play triangle (gradient fill) -->
  <path d="M 226 196 L 332 256 L 226 316 Z" fill="url(#play)"/>
</svg>
