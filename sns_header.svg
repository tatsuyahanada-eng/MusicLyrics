<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: dark purple → deep navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0018"/>
      <stop offset="50%"  stop-color="#080020"/>
      <stop offset="100%" stop-color="#00060f"/>
    </linearGradient>

    <!-- Brand gradient: purple → blue → cyan -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9333EA"/>
      <stop offset="50%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Brand gradient vertical -->
    <linearGradient id="brandGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Accent gradient for text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E879F9"/>
      <stop offset="40%"  stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for accents -->
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Right-side logo glow -->
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1500" height="500" fill="url(#bgGrad)"/>

  <!-- ── Dot grid ── -->
  <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="#4C1D95" opacity="0.4"/>
  </pattern>
  <rect width="1500" height="500" fill="url(#dotGrid)"/>

  <!-- ── Background glow blobs ── -->
  <ellipse cx="200" cy="250" rx="300" ry="200" fill="#7C3AED" opacity="0.06"/>
  <ellipse cx="1300" cy="250" rx="280" ry="180" fill="#0891B2" opacity="0.07"/>
  <ellipse cx="750" cy="500" rx="400" ry="200" fill="#4F46E5" opacity="0.05"/>

  <!-- ── Left neural network decoration ── -->
  <g opacity="0.5">
    <!-- Nodes left side -->
    <circle cx="60"  cy="120" r="5" fill="none" stroke="#9333EA" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="110" cy="80"  r="4" fill="none" stroke="#7C3AED" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="130" cy="160" r="4" fill="none" stroke="#3B82F6" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="60"  cy="200" r="3" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.6"/>
    <circle cx="90"  cy="240" r="4" fill="none" stroke="#06B6D4" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="40"  cy="320" r="3" fill="none" stroke="#9333EA" stroke-width="1" opacity="0.5"/>
    <circle cx="100" cy="350" r="5" fill="none" stroke="#7C3AED" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="150" cy="300" r="3" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.6"/>
    <circle cx="80"  cy="420" r="4" fill="none" stroke="#06B6D4" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="30"  cy="450" r="3" fill="none" stroke="#9333EA" stroke-width="1" opacity="0.4"/>
    <!-- Connection lines left -->
    <line x1="60"  y1="120" x2="110" y2="80"  stroke="#7C3AED" stroke-width="1" opacity="0.4"/>
    <line x1="60"  y1="120" x2="130" y2="160" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
    <line x1="110" y1="80"  x2="130" y2="160" stroke="#9333EA" stroke-width="0.8" opacity="0.3"/>
    <line x1="60"  y1="200" x2="90"  y2="240" stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
    <line x1="130" y1="160" x2="90"  y2="240" stroke="#7C3AED" stroke-width="0.8" opacity="0.3"/>
    <line x1="90"  y1="240" x2="100" y2="350" stroke="#3B82F6" stroke-width="1" opacity="0.35"/>
    <line x1="40"  y1="320" x2="100" y2="350" stroke="#9333EA" stroke-width="0.8" opacity="0.3"/>
    <line x1="100" y1="350" x2="80"  y2="420" stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
    <line x1="150" y1="300" x2="100" y2="350" stroke="#7C3AED" stroke-width="0.8" opacity="0.3"/>
    <line x1="80"  y1="420" x2="30"  y2="450" stroke="#9333EA" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- ── Circuit trace lines (horizontal/vertical) ── -->
  <g opacity="0.2" stroke="#7C3AED" stroke-width="1">
    <line x1="0"   y1="90"  x2="250" y2="90"/>
    <line x1="250" y1="90"  x2="250" y2="140"/>
    <line x1="250" y1="140" x2="180" y2="140"/>
    <circle cx="250" cy="90"  r="3" fill="#9333EA" opacity="0.6"/>
    <circle cx="250" cy="140" r="3" fill="#7C3AED" opacity="0.6"/>
    <circle cx="180" cy="140" r="2" fill="#7C3AED" opacity="0.5"/>
  </g>
  <g opacity="0.15" stroke="#3B82F6" stroke-width="1">
    <line x1="0"   y1="410" x2="200" y2="410"/>
    <line x1="200" y1="410" x2="200" y2="360"/>
    <line x1="200" y1="360" x2="280" y2="360"/>
    <circle cx="200" cy="410" r="3" fill="#3B82F6" opacity="0.6"/>
    <circle cx="200" cy="360" r="3" fill="#3B82F6" opacity="0.6"/>
    <circle cx="280" cy="360" r="2" fill="#3B82F6" opacity="0.4"/>
  </g>
  <g opacity="0.12" stroke="#06B6D4" stroke-width="1">
    <line x1="1500" y1="120" x2="1280" y2="120"/>
    <line x1="1280" y1="120" x2="1280" y2="80"/>
    <line x1="1280" y1="80"  x2="1200" y2="80"/>
    <circle cx="1280" cy="120" r="3" fill="#06B6D4" opacity="0.6"/>
    <circle cx="1280" cy="80"  r="3" fill="#06B6D4" opacity="0.5"/>
  </g>
  <g opacity="0.12" stroke="#9333EA" stroke-width="1">
    <line x1="1500" y1="420" x2="1350" y2="420"/>
    <line x1="1350" y1="420" x2="1350" y2="380"/>
    <line x1="1350" y1="380" x2="1420" y2="380"/>
    <circle cx="1350" cy="420" r="3" fill="#9333EA" opacity="0.6"/>
  </g>

  <!-- ── Horizontal gradient accent line ── -->
  <rect x="280" y="248" width="560" height="2" fill="url(#brandGrad)" opacity="0.7" rx="1"/>

  <!-- ── Main title: Japanese ── -->
  <!-- Shadow/depth layer -->
  <text x="282" y="198"
        font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif"
        font-size="62"
        font-weight="900"
        letter-spacing="4"
        fill="#4C1D95"
        opacity="0.5">毎日 AI ラボ</text>
  <!-- Main text with gradient -->
  <text x="280" y="195"
        font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif"
        font-size="62"
        font-weight="900"
        letter-spacing="4"
        fill="url(#textGrad)"
        filter="url(#glow)">毎日 AI ラボ</text>

  <!-- ── English subtitle ── -->
  <text x="282" y="234"
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="20"
        font-weight="300"
        letter-spacing="8"
        fill="#94A3B8"
        opacity="0.9">DAILY  AI  LAB</text>

  <!-- ── Tagline ── -->
  <text x="282" y="308"
        font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif"
        font-size="22"
        font-weight="400"
        letter-spacing="2"
        fill="#CBD5E1"
        opacity="0.85">AI の作業・実験・発見を毎日お届けします</text>

  <!-- ── Tags / chips ── -->
  <!-- Tag 1: #AI -->
  <rect x="282" y="345" width="80" height="30" rx="15" fill="#4C1D95" opacity="0.7"/>
  <text x="322" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="600"
        fill="#C084FC" text-anchor="middle">#AI</text>

  <!-- Tag 2: #機械学習 -->
  <rect x="372" y="345" width="110" height="30" rx="15" fill="#1E3A5F" opacity="0.7"/>
  <text x="427" y="365" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif"
        font-size="13" font-weight="600" fill="#60A5FA" text-anchor="middle">#機械学習</text>

  <!-- Tag 3: #ChatGPT -->
  <rect x="492" y="345" width="110" height="30" rx="15" fill="#0C4A6E" opacity="0.7"/>
  <text x="547" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="600"
        fill="#22D3EE" text-anchor="middle">#Claude</text>

  <!-- Tag 4: #毎日投稿 -->
  <rect x="612" y="345" width="110" height="30" rx="15" fill="#2D1B69" opacity="0.7"/>
  <text x="667" y="365" font-family="'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif"
        font-size="13" font-weight="600" fill="#A78BFA" text-anchor="middle">#毎日投稿</text>

  <!-- ── Right side: Large logo mark ── -->
  <g transform="translate(1100, 250)">
    <!-- Outer aura -->
    <circle cx="0" cy="0" r="170" fill="#7C3AED" opacity="0.04" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="140" fill="#3B82F6" opacity="0.04" filter="url(#softGlow)"/>

    <!-- Decorative orbit rings -->
    <circle cx="0" cy="0" r="155" fill="none" stroke="#7C3AED" stroke-width="0.8" stroke-dasharray="5 10" opacity="0.25"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="3 12" opacity="0.2"/>

    <!-- Network connections -->
    <!-- Outer to mid -->
    <line x1="0"    y1="-130" x2="-73"  y2="-73"  stroke="#9333EA" stroke-width="1" opacity="0.4"/>
    <line x1="0"    y1="-130" x2="73"   y2="-73"  stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
    <line x1="0"    y1="-130" x2="0"    y2="-95"  stroke="#7C3AED" stroke-width="1" opacity="0.4"/>
    <line x1="-130" y1="0"    x2="-73"  y2="-73"  stroke="#7C3AED" stroke-width="1" opacity="0.4"/>
    <line x1="-130" y1="0"    x2="-73"  y2="73"   stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
    <line x1="-130" y1="0"    x2="-95"  y2="0"    stroke="#9333EA" stroke-width="1" opacity="0.4"/>
    <line x1="130"  y1="0"    x2="73"   y2="-73"  stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
    <line x1="130"  y1="0"    x2="73"   y2="73"   stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
    <line x1="130"  y1="0"    x2="95"   y2="0"    stroke="#7C3AED" stroke-width="1" opacity="0.4"/>
    <line x1="0"    y1="130"  x2="-73"  y2="73"   stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
    <line x1="0"    y1="130"  x2="73"   y2="73"   stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
    <line x1="0"    y1="130"  x2="0"    y2="95"   stroke="#9333EA" stroke-width="1" opacity="0.4"/>

    <!-- Mid ring connections -->
    <line x1="0"   y1="-95" x2="-73" y2="-73" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
    <line x1="0"   y1="-95" x2="73"  y2="-73" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
    <line x1="-95" y1="0"   x2="-73" y2="-73" stroke="#7C3AED" stroke-width="1" opacity="0.5"/>
    <line x1="-95" y1="0"   x2="-73" y2="73"  stroke="#06B6D4" stroke-width="1" opacity="0.5"/>
    <line x1="95"  y1="0"   x2="73"  y2="-73" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    <line x1="95"  y1="0"   x2="73"  y2="73"  stroke="#9333EA" stroke-width="1" opacity="0.5"/>
    <line x1="0"   y1="95"  x2="-73" y2="73"  stroke="#22D3EE" stroke-width="1" opacity="0.5"/>
    <line x1="0"   y1="95"  x2="73"  y2="73"  stroke="#7C3AED" stroke-width="1" opacity="0.5"/>

    <!-- Center connections -->
    <line x1="0" y1="-95" x2="0"   y2="-50" stroke="#9333EA" stroke-width="1.5" opacity="0.6"/>
    <line x1="-95" y1="0" x2="-50" y2="0"   stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
    <line x1="95"  y1="0" x2="50"  y2="0"   stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <line x1="0"   y1="95" x2="0"  y2="50"  stroke="#06B6D4" stroke-width="1.5" opacity="0.6"/>
    <line x1="-73" y1="-73" x2="-50" y2="-50" stroke="#8B5CF6" stroke-width="1.2" opacity="0.55"/>
    <line x1="73"  y1="-73" x2="50"  y2="-50" stroke="#60A5FA" stroke-width="1.2" opacity="0.55"/>
    <line x1="-73" y1="73"  x2="-50" y2="50"  stroke="#22D3EE" stroke-width="1.2" opacity="0.55"/>
    <line x1="73"  y1="73"  x2="50"  y2="50"  stroke="#7C3AED" stroke-width="1.2" opacity="0.55"/>

    <!-- ── Outer nodes ── -->
    <circle cx="0"    cy="-130" r="7"  fill="#050010" stroke="#9333EA" stroke-width="2" filter="url(#glow)"/>
    <circle cx="-130" cy="0"    r="7"  fill="#050010" stroke="#7C3AED" stroke-width="2" filter="url(#glow)"/>
    <circle cx="130"  cy="0"    r="7"  fill="#050010" stroke="#3B82F6" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0"    cy="130"  r="7"  fill="#050010" stroke="#06B6D4" stroke-width="2" filter="url(#glow)"/>

    <!-- ── Corner outer nodes ── -->
    <circle cx="-92"  cy="-92"  r="5"  fill="#050010" stroke="#8B5CF6" stroke-width="1.5" opacity="0.8"/>
    <circle cx="92"   cy="-92"  r="5"  fill="#050010" stroke="#60A5FA" stroke-width="1.5" opacity="0.8"/>
    <circle cx="-92"  cy="92"   r="5"  fill="#050010" stroke="#22D3EE" stroke-width="1.5" opacity="0.8"/>
    <circle cx="92"   cy="92"   r="5"  fill="#050010" stroke="#7C3AED" stroke-width="1.5" opacity="0.8"/>

    <!-- ── Mid ring nodes ── -->
    <circle cx="0"   cy="-95" r="8"  fill="#050010" stroke="url(#brandGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="-95" cy="0"   r="8"  fill="#050010" stroke="url(#brandGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="95"  cy="0"   r="8"  fill="#050010" stroke="url(#brandGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="0"   cy="95"  r="8"  fill="#050010" stroke="url(#brandGrad)" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="-73" cy="-73" r="6"  fill="#050010" stroke="#9333EA" stroke-width="2" filter="url(#glow)"/>
    <circle cx="73"  cy="-73" r="6"  fill="#050010" stroke="#3B82F6" stroke-width="2" filter="url(#glow)"/>
    <circle cx="-73" cy="73"  r="6"  fill="#050010" stroke="#06B6D4" stroke-width="2" filter="url(#glow)"/>
    <circle cx="73"  cy="73"  r="6"  fill="#050010" stroke="#7C3AED" stroke-width="2" filter="url(#glow)"/>

    <!-- ── Inner nodes ── -->
    <circle cx="0"   cy="-50" r="6"  fill="#050010" stroke="#9333EA" stroke-width="2" filter="url(#glow)"/>
    <circle cx="-50" cy="0"   r="6"  fill="#050010" stroke="#7C3AED" stroke-width="2" filter="url(#glow)"/>
    <circle cx="50"  cy="0"   r="6"  fill="#050010" stroke="#3B82F6" stroke-width="2" filter="url(#glow)"/>
    <circle cx="0"   cy="50"  r="6"  fill="#050010" stroke="#06B6D4" stroke-width="2" filter="url(#glow)"/>
    <circle cx="-50" cy="-50" r="5"  fill="#050010" stroke="#8B5CF6" stroke-width="1.8" filter="url(#glow)"/>
    <circle cx="50"  cy="-50" r="5"  fill="#050010" stroke="#60A5FA" stroke-width="1.8" filter="url(#glow)"/>
    <circle cx="-50" cy="50"  r="5"  fill="#050010" stroke="#22D3EE" stroke-width="1.8" filter="url(#glow)"/>
    <circle cx="50"  cy="50"  r="5"  fill="#050010" stroke="#7C3AED" stroke-width="1.8" filter="url(#glow)"/>

    <!-- ── Central hub ── -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.3" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="36" fill="#06000f"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#brandGrad)" stroke-width="3"/>
    <text x="0" y="12"
          font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="32"
          font-weight="700"
          letter-spacing="1"
          text-anchor="middle"
          fill="url(#textGrad)"
          filter="url(#glow)">AI</text>
  </g>

  <!-- ── Bottom border accent ── -->
  <rect x="0" y="496" width="1500" height="4" fill="url(#brandGrad)" opacity="0.8" rx="2"/>

  <!-- ── Top-left subtle accent dot ── -->
  <circle cx="30" cy="30" r="4" fill="#9333EA" opacity="0.5" filter="url(#glow)"/>
  <circle cx="50" cy="30" r="2" fill="#7C3AED" opacity="0.4"/>
  <circle cx="30" cy="50" r="2" fill="#3B82F6" opacity="0.4"/>
</svg>
