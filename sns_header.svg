<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#060012"/>
      <stop offset="60%"  stop-color="#090018"/>
      <stop offset="100%" stop-color="#000a10"/>
    </linearGradient>

    <!-- Orange (struggle/energy) gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF4500"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>

    <!-- Cyan (AI/tech) gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#00FFE5"/>
    </linearGradient>

    <!-- Full brand gradient orange→purple→cyan -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF6B00"/>
      <stop offset="40%"  stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Title text gradient: white → warm white -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0D0FF"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="orangeGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="whiteGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="1500" height="500" fill="url(#bgGrad)"/>

  <!-- Dot grid -->
  <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="14" cy="14" r="1" fill="#2D1B69" opacity="0.45"/>
  </pattern>
  <rect width="1500" height="500" fill="url(#dotGrid)"/>

  <!-- Background glow blobs -->
  <ellipse cx="280"  cy="260" rx="320" ry="220" fill="#FF4500" opacity="0.05" filter="url(#bigGlow)"/>
  <ellipse cx="1200" cy="240" rx="300" ry="200" fill="#00BFFF" opacity="0.07" filter="url(#bigGlow)"/>
  <ellipse cx="750"  cy="520" rx="450" ry="200" fill="#7C3AED" opacity="0.06"/>

  <!-- ── Left decoration: circuit traces ── -->
  <g opacity="0.25">
    <line x1="0"   y1="60"  x2="200" y2="60"  stroke="#FF6B00" stroke-width="1.5"/>
    <line x1="200" y1="60"  x2="200" y2="110" stroke="#FF6B00" stroke-width="1.5"/>
    <line x1="200" y1="110" x2="120" y2="110" stroke="#FF6B00" stroke-width="1.5"/>
    <circle cx="200" cy="60"  r="4" fill="#FF8C00" opacity="0.8"/>
    <circle cx="200" cy="110" r="4" fill="#FF6B00" opacity="0.8"/>
    <circle cx="120" cy="110" r="3" fill="#FF6B00" opacity="0.6"/>

    <line x1="0"   y1="440" x2="180" y2="440" stroke="#FF8C00" stroke-width="1.5"/>
    <line x1="180" y1="440" x2="180" y2="390" stroke="#FF8C00" stroke-width="1.5"/>
    <circle cx="180" cy="440" r="4" fill="#FFB800" opacity="0.8"/>
    <circle cx="180" cy="390" r="3" fill="#FF8C00" opacity="0.6"/>
  </g>

  <!-- Right circuit traces -->
  <g opacity="0.2">
    <line x1="1500" y1="80"  x2="1320" y2="80"  stroke="#00E5FF" stroke-width="1.5"/>
    <line x1="1320" y1="80"  x2="1320" y2="130" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="1320" cy="80"  r="4" fill="#00E5FF" opacity="0.7"/>
    <circle cx="1320" cy="130" r="3" fill="#00BFFF" opacity="0.6"/>

    <line x1="1500" y1="440" x2="1360" y2="440" stroke="#00BFFF" stroke-width="1.5"/>
    <line x1="1360" y1="440" x2="1360" y2="380" stroke="#00BFFF" stroke-width="1.5"/>
    <circle cx="1360" cy="440" r="4" fill="#00E5FF" opacity="0.7"/>
  </g>

  <!-- ── Left neural-net decoration ── -->
  <g opacity="0.45">
    <line x1="50"  y1="160" x2="100" y2="120" stroke="#FF6B00" stroke-width="1.2"/>
    <line x1="50"  y1="160" x2="90"  y2="210" stroke="#FFB800" stroke-width="1.2"/>
    <line x1="100" y1="120" x2="90"  y2="210" stroke="#FF8C00" stroke-width="0.8"/>
    <line x1="90"  y1="210" x2="55"  y2="280" stroke="#FF6B00" stroke-width="1.2"/>
    <line x1="55"  y1="280" x2="110" y2="340" stroke="#FFB800" stroke-width="1.2"/>
    <line x1="90"  y1="210" x2="130" y2="270" stroke="#FF8C00" stroke-width="0.8"/>
    <line x1="130" y1="270" x2="110" y2="340" stroke="#FF6B00" stroke-width="0.8"/>
    <line x1="55"  y1="280" x2="30"  y2="360" stroke="#FF6B00" stroke-width="0.8"/>

    <circle cx="50"  cy="160" r="6" fill="#060012" stroke="#FF6B00" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="100" cy="120" r="5" fill="#060012" stroke="#FF8C00" stroke-width="1.8" filter="url(#nodeGlow)"/>
    <circle cx="90"  cy="210" r="7" fill="#060012" stroke="#FF6B00" stroke-width="2.2" filter="url(#nodeGlow)"/>
    <circle cx="55"  cy="280" r="6" fill="#060012" stroke="#FFB800" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="130" cy="270" r="4" fill="#060012" stroke="#FF8C00" stroke-width="1.5"/>
    <circle cx="110" cy="340" r="6" fill="#060012" stroke="#FF6B00" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="30"  cy="360" r="4" fill="#060012" stroke="#FFB800" stroke-width="1.5"/>
  </g>

  <!-- ── Right neural-net decoration ── -->
  <g opacity="0.4">
    <line x1="1440" y1="140" x2="1390" y2="100" stroke="#00E5FF" stroke-width="1.2"/>
    <line x1="1440" y1="140" x2="1410" y2="200" stroke="#00BFFF" stroke-width="1.2"/>
    <line x1="1390" y1="100" x2="1410" y2="200" stroke="#00E5FF" stroke-width="0.8"/>
    <line x1="1410" y1="200" x2="1450" y2="270" stroke="#00E5FF" stroke-width="1.2"/>
    <line x1="1450" y1="270" x2="1400" y2="340" stroke="#00BFFF" stroke-width="1.2"/>
    <line x1="1410" y1="200" x2="1380" y2="280" stroke="#00E5FF" stroke-width="0.8"/>
    <line x1="1380" y1="280" x2="1400" y2="340" stroke="#00BFFF" stroke-width="0.8"/>

    <circle cx="1440" cy="140" r="6" fill="#060012" stroke="#00E5FF" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="1390" cy="100" r="5" fill="#060012" stroke="#00BFFF" stroke-width="1.8" filter="url(#nodeGlow)"/>
    <circle cx="1410" cy="200" r="7" fill="#060012" stroke="#00E5FF" stroke-width="2.2" filter="url(#nodeGlow)"/>
    <circle cx="1450" cy="270" r="6" fill="#060012" stroke="#00BFFF" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="1380" cy="280" r="4" fill="#060012" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="1400" cy="340" r="6" fill="#060012" stroke="#00BFFF" stroke-width="2" filter="url(#nodeGlow)"/>
  </g>

  <!-- ── Main text block ── -->

  <!-- Shadow layers for depth -->
  <text x="246" y="182"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif"
        font-size="78" font-weight="900" letter-spacing="2"
        fill="#FF4500" opacity="0.25" filter="url(#orangeGlow)">おじさんSEの</text>
  <text x="246" y="270"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif"
        font-size="78" font-weight="900" letter-spacing="2"
        fill="#00BFFF" opacity="0.2" filter="url(#cyanGlow)">AI 奮闘記</text>

  <!-- Line 1: おじさんSEの — white with warm tint -->
  <text x="244" y="180"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif"
        font-size="78" font-weight="900" letter-spacing="2"
        fill="#FFFFFF" filter="url(#whiteGlow)">おじさんSEの</text>

  <!-- Line 2: AI — orange glow, big impact -->
  <text x="244" y="270"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif"
        font-size="78" font-weight="900" letter-spacing="2"
        fill="url(#orangeGrad)" filter="url(#orangeGlow)">AI</text>

  <!-- Line 2: 奮闘記 — cyan glow -->
  <text x="380" y="270"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif"
        font-size="78" font-weight="900" letter-spacing="2"
        fill="url(#cyanGrad)" filter="url(#cyanGlow)"> 奮闘記</text>

  <!-- ── Accent divider lines ── -->
  <!-- Orange bar (left) -->
  <rect x="244" y="288" width="140" height="4" fill="url(#orangeGrad)" rx="2" opacity="0.9"/>
  <!-- Cyan bar (right, starts after orange) -->
  <rect x="390" y="288" width="260" height="4" fill="url(#cyanGrad)" rx="2" opacity="0.9"/>
  <!-- Thin separator dot -->
  <circle cx="388" cy="290" r="4" fill="#FFFFFF" opacity="0.9"/>

  <!-- ── English sub-title ── -->
  <text x="248" y="325"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="400" letter-spacing="7"
        fill="#94A3B8" opacity="0.9">A MIDDLE-AGED SE'S  DAILY  AI  STRUGGLE</text>

  <!-- ── Tagline ── -->
  <text x="248" y="375"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif"
        font-size="21" font-weight="500" letter-spacing="1.5"
        fill="#E2E8F0" opacity="0.9">毎日 AI と格闘しながら、少しずつ便利になっていく記録</text>

  <!-- ── Hashtag chips ── -->
  <!-- #SE -->
  <rect x="248" y="404" width="64"  height="28" rx="14" fill="#7C2D12" opacity="0.75"/>
  <text x="280" y="422" font-family="Arial,sans-serif" font-size="13" font-weight="700"
        fill="#FCA86A" text-anchor="middle">#SE</text>

  <!-- #AI格闘 -->
  <rect x="322" y="404" width="100" height="28" rx="14" fill="#7C2D12" opacity="0.75"/>
  <text x="372" y="422"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif"
        font-size="12" font-weight="700" fill="#FCA86A" text-anchor="middle">#AI格闘</text>

  <!-- #毎日投稿 -->
  <rect x="432" y="404" width="108" height="28" rx="14" fill="#0C4A6E" opacity="0.75"/>
  <text x="486" y="422"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif"
        font-size="12" font-weight="700" fill="#67E8F9" text-anchor="middle">#毎日投稿</text>

  <!-- #実験中 -->
  <rect x="550" y="404" width="90"  height="28" rx="14" fill="#0C4A6E" opacity="0.75"/>
  <text x="595" y="422"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif"
        font-size="12" font-weight="700" fill="#67E8F9" text-anchor="middle">#実験中</text>

  <!-- #上達中 -->
  <rect x="650" y="404" width="90"  height="28" rx="14" fill="#1e1b4b" opacity="0.75"/>
  <text x="695" y="422"
        font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif"
        font-size="12" font-weight="700" fill="#A5B4FC" text-anchor="middle">#上達中</text>

  <!-- ── Right side: large logo ── -->
  <g transform="translate(1130, 252)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="165" fill="#FF4500" opacity="0.04" filter="url(#bigGlow)"/>
    <circle cx="0" cy="0" r="140" fill="#00BFFF" opacity="0.05" filter="url(#bigGlow)"/>

    <!-- Orbit rings -->
    <circle cx="0" cy="0" r="152" fill="none" stroke="#FF6B00" stroke-width="1" stroke-dasharray="6 10" opacity="0.22"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 12" opacity="0.18"/>

    <!-- Orange connections (left/bottom) -->
    <line x1="0"    y1="-128" x2="-90"  y2="-90"  stroke="#FF6B00" stroke-width="1.2" opacity="0.45"/>
    <line x1="-128" y1="0"    x2="-90"  y2="-90"  stroke="#FFB800" stroke-width="1.2" opacity="0.45"/>
    <line x1="-128" y1="0"    x2="-90"  y2="90"   stroke="#FF6B00" stroke-width="1.2" opacity="0.45"/>
    <line x1="0"    y1="128"  x2="-90"  y2="90"   stroke="#FF8C00" stroke-width="1.2" opacity="0.45"/>
    <line x1="-90"  y1="-90"  x2="-92"  y2="0"    stroke="#FF6B00" stroke-width="1" opacity="0.4"/>
    <line x1="-90"  y1="90"   x2="-92"  y2="0"    stroke="#FFB800" stroke-width="1" opacity="0.4"/>
    <line x1="0"    y1="-92"  x2="-90"  y2="-90"  stroke="#FF8C00" stroke-width="1" opacity="0.4"/>
    <line x1="0"    y1="92"   x2="-90"  y2="90"   stroke="#FF6B00" stroke-width="1" opacity="0.4"/>

    <!-- Cyan connections (right/top) -->
    <line x1="0"    y1="-128" x2="90"   y2="-90"  stroke="#00E5FF" stroke-width="1.2" opacity="0.45"/>
    <line x1="128"  y1="0"    x2="90"   y2="-90"  stroke="#00BFFF" stroke-width="1.2" opacity="0.45"/>
    <line x1="128"  y1="0"    x2="90"   y2="90"   stroke="#00E5FF" stroke-width="1.2" opacity="0.45"/>
    <line x1="0"    y1="128"  x2="90"   y2="90"   stroke="#00BFFF" stroke-width="1.2" opacity="0.45"/>
    <line x1="90"   y1="-90"  x2="92"   y2="0"    stroke="#00E5FF" stroke-width="1" opacity="0.4"/>
    <line x1="90"   y1="90"   x2="92"   y2="0"    stroke="#00BFFF" stroke-width="1" opacity="0.4"/>
    <line x1="0"    y1="-92"  x2="90"   y2="-90"  stroke="#00E5FF" stroke-width="1" opacity="0.4"/>
    <line x1="0"    y1="92"   x2="90"   y2="90"   stroke="#00BFFF" stroke-width="1" opacity="0.4"/>

    <!-- Center lines -->
    <line x1="0" y1="-92" x2="0"   y2="-46" stroke="#00E5FF" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="92"  x2="0"   y2="46"  stroke="#FF6B00" stroke-width="2" opacity="0.7"/>
    <line x1="92" y1="0"  x2="46"  y2="0"   stroke="#00BFFF" stroke-width="2" opacity="0.7"/>
    <line x1="-92" y1="0" x2="-46" y2="0"   stroke="#FFB800" stroke-width="2" opacity="0.7"/>

    <!-- Outer nodes orange -->
    <circle cx="0"    cy="-128" r="8" fill="#060012" stroke="#FF6B00" stroke-width="2.5" filter="url(#nodeGlow)"/>
    <circle cx="-128" cy="0"    r="8" fill="#060012" stroke="#FFB800" stroke-width="2.5" filter="url(#nodeGlow)"/>
    <circle cx="0"    cy="128"  r="8" fill="#060012" stroke="#FF8C00" stroke-width="2.5" filter="url(#nodeGlow)"/>
    <circle cx="-90"  cy="-90"  r="6" fill="#060012" stroke="#FF6B00" stroke-width="2"   filter="url(#nodeGlow)"/>
    <circle cx="-90"  cy="90"   r="6" fill="#060012" stroke="#FFB800" stroke-width="2"   filter="url(#nodeGlow)"/>

    <!-- Outer nodes cyan -->
    <circle cx="128"  cy="0"    r="8" fill="#060012" stroke="#00E5FF" stroke-width="2.5" filter="url(#nodeGlow)"/>
    <circle cx="90"   cy="-90"  r="6" fill="#060012" stroke="#00E5FF" stroke-width="2"   filter="url(#nodeGlow)"/>
    <circle cx="90"   cy="90"   r="6" fill="#060012" stroke="#00BFFF" stroke-width="2"   filter="url(#nodeGlow)"/>

    <!-- Inner nodes -->
    <circle cx="0"   cy="-92" r="8" fill="#060012" stroke="#00E5FF" stroke-width="2.5" filter="url(#nodeGlow)"/>
    <circle cx="92"  cy="0"   r="8" fill="#060012" stroke="#00BFFF" stroke-width="2.5" filter="url(#nodeGlow)"/>
    <circle cx="0"   cy="92"  r="8" fill="#060012" stroke="#FF6B00" stroke-width="2.5" filter="url(#nodeGlow)"/>
    <circle cx="-92" cy="0"   r="8" fill="#060012" stroke="#FFB800" stroke-width="2.5" filter="url(#nodeGlow)"/>

    <!-- Hub -->
    <circle cx="0" cy="0" r="50" fill="#060012"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#orangeGrad)" stroke-width="2" stroke-dasharray="160 1000" stroke-dashoffset="0"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#cyanGrad)"   stroke-width="2" stroke-dasharray="160 1000" stroke-dashoffset="-170"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#1a0040" stroke-width="1"/>

    <!-- Hub "AI" split color -->
    <text x="-18" y="16"
          font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
          font-size="40" font-weight="900"
          fill="#FF8C00" filter="url(#orangeGlow)">A</text>
    <text x="10" y="16"
          font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
          font-size="40" font-weight="900"
          fill="#00E5FF" filter="url(#cyanGlow)">I</text>
  </g>

  <!-- ── Bottom brand bar ── -->
  <rect x="0" y="494" width="1500" height="6" fill="url(#brandGrad)" opacity="0.85" rx="3"/>

  <!-- Top-left spark -->
  <circle cx="32" cy="32" r="5" fill="#FF6B00" opacity="0.6" filter="url(#nodeGlow)"/>
  <circle cx="52" cy="32" r="3" fill="#FF8C00" opacity="0.4"/>
  <circle cx="32" cy="52" r="2" fill="#FFB800" opacity="0.4"/>
</svg>
