<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#0e0022"/>
      <stop offset="100%" stop-color="#020009"/>
    </radialGradient>

    <!-- Orange (human/struggle) -->
    <linearGradient id="ogGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF3D00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>

    <!-- Cyan (AI/precision) -->
    <linearGradient id="cyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#00FFE5"/>
    </linearGradient>

    <!-- Hub ring gradient: orange → purple → cyan -->
    <linearGradient id="hubRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF6B00"/>
      <stop offset="45%"  stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Split diagonal gradient for center fill -->
    <linearGradient id="splitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1a0500"/>
      <stop offset="48%"  stop-color="#0a0018"/>
      <stop offset="100%" stop-color="#00050f"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="ogGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hubGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="circ">
      <circle cx="200" cy="200" r="192"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <circle cx="200" cy="200" r="200" fill="url(#bgGrad)"/>

  <g clip-path="url(#circ)">

    <!-- Fine dot grid -->
    <pattern id="dp" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.9" fill="#2D1060" opacity="0.55"/>
    </pattern>
    <rect width="400" height="400" fill="url(#dp)"/>

    <!-- Diagonal split glow (bottom-left orange, top-right cyan) -->
    <ellipse cx="100" cy="310" rx="180" ry="140" fill="#FF3D00" opacity="0.06"/>
    <ellipse cx="300" cy="90"  rx="170" ry="130" fill="#0099FF" opacity="0.07"/>

    <!-- ═══════════════════════════════════════
         ORANGE CLUSTER — bottom-left
         Represents the struggling SE side
    ═══════════════════════════════════════ -->

    <!-- Branch 1: center → deep left-bottom -->
    <line x1="200" y1="200" x2="155" y2="248" stroke="#FF6B00" stroke-width="1.8" opacity="0.7"/>
    <line x1="155" y1="248" x2="108" y2="268" stroke="#FF5500" stroke-width="1.5" opacity="0.65"/>
    <line x1="108" y1="268" x2="72"  y2="308" stroke="#FF4000" stroke-width="1.3" opacity="0.6"/>
    <line x1="72"  y1="308" x2="50"  y2="350" stroke="#FF3D00" stroke-width="1.1" opacity="0.5"/>
    <line x1="72"  y1="308" x2="100" y2="345" stroke="#FF6B00" stroke-width="1.1" opacity="0.5"/>

    <!-- Branch 2: center → left -->
    <line x1="200" y1="200" x2="138" y2="210" stroke="#FF8C00" stroke-width="1.6" opacity="0.65"/>
    <line x1="138" y1="210" x2="88"  y2="232" stroke="#FF6B00" stroke-width="1.3" opacity="0.6"/>
    <line x1="88"  y1="232" x2="58"  y2="260" stroke="#FF5500" stroke-width="1.1" opacity="0.55"/>
    <line x1="88"  y1="232" x2="68"  y2="195" stroke="#FFAA00" stroke-width="1.1" opacity="0.5"/>

    <!-- Branch 3: center → bottom -->
    <line x1="200" y1="200" x2="190" y2="265" stroke="#FF9500" stroke-width="1.6" opacity="0.65"/>
    <line x1="190" y1="265" x2="162" y2="318" stroke="#FF6B00" stroke-width="1.3" opacity="0.6"/>
    <line x1="162" y1="318" x2="130" y2="352" stroke="#FF4500" stroke-width="1.1" opacity="0.55"/>
    <line x1="190" y1="265" x2="228" y2="315" stroke="#FFAA00" stroke-width="1.1" opacity="0.5"/>

    <!-- Cross-connections (orange cluster) -->
    <line x1="155" y1="248" x2="138" y2="210" stroke="#FF8C00" stroke-width="0.9" opacity="0.4"/>
    <line x1="108" y1="268" x2="88"  y2="232" stroke="#FF6B00" stroke-width="0.9" opacity="0.35"/>
    <line x1="72"  y1="308" x2="58"  y2="260" stroke="#FF5500" stroke-width="0.8" opacity="0.3"/>
    <line x1="162" y1="318" x2="100" y2="345" stroke="#FF3D00" stroke-width="0.8" opacity="0.3"/>

    <!-- Orange nodes (large primary) -->
    <circle cx="155" cy="248" r="9"  fill="#0e0015" stroke="#FF8C00" stroke-width="2.5" filter="url(#ogGlow)"/>
    <circle cx="138" cy="210" r="8"  fill="#0e0015" stroke="#FF6B00" stroke-width="2.2" filter="url(#ogGlow)"/>
    <circle cx="190" cy="265" r="8"  fill="#0e0015" stroke="#FFAA00" stroke-width="2.2" filter="url(#ogGlow)"/>

    <!-- Orange nodes (medium) -->
    <circle cx="108" cy="268" r="7"  fill="#0e0015" stroke="#FF5500" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="88"  cy="232" r="6"  fill="#0e0015" stroke="#FF6B00" stroke-width="1.8" filter="url(#nodeGlow)"/>
    <circle cx="162" cy="318" r="7"  fill="#0e0015" stroke="#FF6B00" stroke-width="2" filter="url(#nodeGlow)"/>
    <circle cx="228" cy="315" r="5"  fill="#0e0015" stroke="#FFAA00" stroke-width="1.6"/>

    <!-- Orange nodes (small outer) -->
    <circle cx="72"  cy="308" r="6"  fill="#0e0015" stroke="#FF4000" stroke-width="1.8" filter="url(#nodeGlow)"/>
    <circle cx="58"  cy="260" r="5"  fill="#0e0015" stroke="#FF5500" stroke-width="1.5"/>
    <circle cx="50"  cy="350" r="4"  fill="#0e0015" stroke="#FF3D00" stroke-width="1.4" opacity="0.8"/>
    <circle cx="100" cy="345" r="4"  fill="#0e0015" stroke="#FF6B00" stroke-width="1.4" opacity="0.8"/>
    <circle cx="68"  cy="195" r="4"  fill="#0e0015" stroke="#FFAA00" stroke-width="1.4" opacity="0.7"/>
    <circle cx="130" cy="352" r="4"  fill="#0e0015" stroke="#FF4500" stroke-width="1.3" opacity="0.7"/>

    <!-- ═══════════════════════════════════════
         CYAN CLUSTER — top-right
         Represents the AI/precision side
    ═══════════════════════════════════════ -->

    <!-- Branch 1: center → top-right -->
    <line x1="200" y1="200" x2="248" y2="152" stroke="#00BFFF" stroke-width="1.8" opacity="0.7"/>
    <line x1="248" y1="152" x2="292" y2="130" stroke="#00D4FF" stroke-width="1.5" opacity="0.65"/>
    <line x1="292" y1="130" x2="330" y2="95"  stroke="#00E5FF" stroke-width="1.3" opacity="0.6"/>
    <line x1="330" y1="95"  x2="355" y2="60"  stroke="#00FFE5" stroke-width="1.1" opacity="0.5"/>
    <line x1="330" y1="95"  x2="360" y2="118" stroke="#00BFFF" stroke-width="1.1" opacity="0.5"/>

    <!-- Branch 2: center → right -->
    <line x1="200" y1="200" x2="264" y2="192" stroke="#00BFFF" stroke-width="1.6" opacity="0.65"/>
    <line x1="264" y1="192" x2="318" y2="172" stroke="#00D4FF" stroke-width="1.3" opacity="0.6"/>
    <line x1="318" y1="172" x2="348" y2="148" stroke="#00E5FF" stroke-width="1.1" opacity="0.55"/>
    <line x1="318" y1="172" x2="335" y2="205" stroke="#0099FF" stroke-width="1.1" opacity="0.5"/>

    <!-- Branch 3: center → top -->
    <line x1="200" y1="200" x2="210" y2="138" stroke="#0099FF" stroke-width="1.6" opacity="0.65"/>
    <line x1="210" y1="138" x2="240" y2="88"  stroke="#00BFFF" stroke-width="1.3" opacity="0.6"/>
    <line x1="240" y1="88"  x2="272" y2="52"  stroke="#00E5FF" stroke-width="1.1" opacity="0.55"/>
    <line x1="210" y1="138" x2="168" y2="90"  stroke="#0099FF" stroke-width="1.1" opacity="0.5"/>

    <!-- Cross-connections (cyan — more rectilinear, ordered) -->
    <line x1="248" y1="152" x2="264" y2="192" stroke="#00BFFF" stroke-width="0.9" opacity="0.4"/>
    <line x1="292" y1="130" x2="318" y2="172" stroke="#00D4FF" stroke-width="0.9" opacity="0.35"/>
    <line x1="330" y1="95"  x2="348" y2="148" stroke="#00E5FF" stroke-width="0.8" opacity="0.3"/>
    <line x1="240" y1="88"  x2="292" y2="130" stroke="#00BFFF" stroke-width="0.8" opacity="0.3"/>

    <!-- Cyan nodes (large primary) -->
    <circle cx="248" cy="152" r="9"  fill="#000a18" stroke="#00BFFF" stroke-width="2.5" filter="url(#cyGlow)"/>
    <circle cx="264" cy="192" r="8"  fill="#000a18" stroke="#0099FF" stroke-width="2.2" filter="url(#cyGlow)"/>
    <circle cx="210" cy="138" r="8"  fill="#000a18" stroke="#00D4FF" stroke-width="2.2" filter="url(#cyGlow)"/>

    <!-- Cyan nodes (medium) -->
    <circle cx="292" cy="130" r="7"  fill="#000a18" stroke="#00D4FF" stroke-width="2"   filter="url(#nodeGlow)"/>
    <circle cx="318" cy="172" r="6"  fill="#000a18" stroke="#00BFFF" stroke-width="1.8" filter="url(#nodeGlow)"/>
    <circle cx="240" cy="88"  r="7"  fill="#000a18" stroke="#00E5FF" stroke-width="2"   filter="url(#nodeGlow)"/>
    <circle cx="168" cy="90"  r="5"  fill="#000a18" stroke="#0099FF" stroke-width="1.6"/>

    <!-- Cyan nodes (small outer) -->
    <circle cx="330" cy="95"  r="6"  fill="#000a18" stroke="#00E5FF" stroke-width="1.8" filter="url(#nodeGlow)"/>
    <circle cx="348" cy="148" r="5"  fill="#000a18" stroke="#00BFFF" stroke-width="1.5"/>
    <circle cx="355" cy="60"  r="4"  fill="#000a18" stroke="#00FFE5" stroke-width="1.4" opacity="0.8"/>
    <circle cx="360" cy="118" r="4"  fill="#000a18" stroke="#00BFFF" stroke-width="1.4" opacity="0.8"/>
    <circle cx="335" cy="205" r="4"  fill="#000a18" stroke="#0099FF" stroke-width="1.4" opacity="0.7"/>
    <circle cx="272" cy="52"  r="4"  fill="#000a18" stroke="#00FFE5" stroke-width="1.3" opacity="0.7"/>

    <!-- ═══════════════════════════════════════
         DIAGONAL SPLIT LINE (subtle)
    ═══════════════════════════════════════ -->
    <line x1="80" y1="80" x2="320" y2="320"
          stroke="#6D28D9" stroke-width="0.6" opacity="0.3" stroke-dasharray="4 8"/>

    <!-- ═══════════════════════════════════════
         CENTRAL HEXAGONAL HUB
    ═══════════════════════════════════════ -->

    <!-- Hex glow aura -->
    <polygon points="200,155 236,177 236,223 200,245 164,223 164,177"
             fill="#9333EA" opacity="0.12" filter="url(#hubGlow)"/>

    <!-- Hex outer track (background hex, slightly larger) -->
    <polygon points="200,152 238,174 238,226 200,248 162,226 162,174"
             fill="url(#splitGrad)" stroke="url(#hubRingGrad)" stroke-width="3"/>

    <!-- Inner hex (slightly inset) -->
    <polygon points="200,158 233,178 233,222 200,242 167,222 167,178"
             fill="#06000e" stroke="#2D1060" stroke-width="0.8"/>

    <!-- Circuit traces inside hex (decorative) -->
    <!-- Horizontal center trace -->
    <line x1="172" y1="200" x2="228" y2="200" stroke="#3B1F8C" stroke-width="1.5" opacity="0.6"/>
    <!-- Left corner traces -->
    <line x1="172" y1="200" x2="165" y2="188" stroke="#FF6B00" stroke-width="1" opacity="0.4"/>
    <line x1="172" y1="200" x2="165" y2="212" stroke="#FF6B00" stroke-width="1" opacity="0.4"/>
    <!-- Right corner traces -->
    <line x1="228" y1="200" x2="235" y2="188" stroke="#00BFFF" stroke-width="1" opacity="0.4"/>
    <line x1="228" y1="200" x2="235" y2="212" stroke="#00BFFF" stroke-width="1" opacity="0.4"/>
    <!-- Small contact pads -->
    <circle cx="172" cy="200" r="2.5" fill="#FF8C00" opacity="0.7"/>
    <circle cx="228" cy="200" r="2.5" fill="#00BFFF" opacity="0.7"/>
    <!-- Top/bottom traces -->
    <line x1="200" y1="162" x2="200" y2="175" stroke="#6D28D9" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="225" x2="200" y2="238" stroke="#6D28D9" stroke-width="1" opacity="0.5"/>
    <circle cx="200" cy="175" r="2" fill="#9333EA" opacity="0.6"/>
    <circle cx="200" cy="225" r="2" fill="#9333EA" opacity="0.6"/>

    <!-- "A" — orange, bold -->
    <text x="182" y="214"
          font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
          font-size="36" font-weight="900" letter-spacing="-1"
          fill="#FF8C00" filter="url(#ogGlow)">A</text>

    <!-- "I" — cyan, bold -->
    <text x="211" y="214"
          font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
          font-size="36" font-weight="900"
          fill="#00E5FF" filter="url(#cyGlow)">I</text>

  </g><!-- end clip -->

  <!-- Outer border ring -->
  <circle cx="200" cy="200" r="192" fill="none" stroke="url(#hubRingGrad)" stroke-width="2.5" opacity="0.65"/>
  <!-- Very faint outer ring -->
  <circle cx="200" cy="200" r="189" fill="none" stroke="#4C1D95" stroke-width="0.6" opacity="0.3"/>
</svg>
