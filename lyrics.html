<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Lyrics</title>
  <link rel="stylesheet" href="lyrics.css?v=3">
</head>
<body class="ly-body">

  <header class="ly-header">
    <h1 class="ly-header-title">Music Lyrics</h1>
    <p class="ly-header-notice">
      本ツールは個人の私的鑑賞目的専用です。取得した歌詞はサーバーに保存されません。第三者への共有・公開はお控えください。
    </p>
  </header>

  <!-- API Key Setup -->
  <section id="apiSetup" class="ly-api-setup">
    <div class="ly-api-setup-inner">
      <p class="ly-api-label">YouTube Data API キー（初回のみ設定）</p>
      <div class="ly-api-row">
        <input id="apiKeyInput" class="ly-input ly-api-input" type="password"
          placeholder="AIza..." autocomplete="off">
        <button id="saveApiKey" class="ly-btn ly-btn-sm">保存</button>
        <button id="clearApiKey" class="ly-btn ly-btn-sm ly-btn-outline">削除</button>
      </div>
      <p class="ly-api-note">
        <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">Google Cloud Console</a>
        で YouTube Data API v3 を有効にし、APIキーを取得してください（無料枠あり）。
      </p>
    </div>
  </section>

  <!-- Search -->
  <section class="ly-search-section">
    <div class="ly-tabs" role="tablist" aria-label="検索モード">
      <button class="ly-tab active" data-mode="song" role="tab" aria-selected="true">🎵 アーティスト + 曲名</button>
      <button class="ly-tab" data-mode="artist" role="tab" aria-selected="false">🔍 アーティストのみ</button>
    </div>

    <form id="searchForm" class="ly-search-form">
      <div class="ly-input-row">
        <input id="artistInput" class="ly-input" type="text"
          placeholder="アーティスト名（日本語OK）" autocomplete="off" required>
        <div id="titleWrap" class="ly-title-wrap">
          <input id="titleInput" class="ly-input" type="text"
            placeholder="曲名（日本語OK）" autocomplete="off">
        </div>
        <button id="fetchBtn" type="submit" class="ly-btn">歌詞を取得</button>
      </div>
      <p id="searchHint" class="ly-hint">
        YouTube で楽曲を検索し、歌詞と一緒に楽しめます。
      </p>
    </form>
    <div id="status" class="ly-status" aria-live="polite"></div>
  </section>

  <!-- iTunes song list -->
  <section id="songList" class="ly-song-list" hidden>
    <div class="ly-song-list-inner">
      <div class="ly-song-list-header">
        <span id="songListInfo" class="ly-song-list-info"></span>
        <button id="closeSongList" class="ly-close-btn" aria-label="リストを閉じる">✕ 閉じる</button>
      </div>
      <div id="songCards" class="ly-song-cards"></div>
      <div class="ly-pagination">
        <button id="prevPageBtn" class="ly-page-btn" disabled>◀ 前へ</button>
        <span id="pageInfo" class="ly-page-info"></span>
        <button id="nextPageBtn" class="ly-page-btn">次へ ▶</button>
      </div>
    </div>
  </section>

  <!-- YouTube search results -->
  <section id="ytResults" class="ly-yt-results" hidden>
    <div class="ly-yt-results-inner">
      <div class="ly-yt-results-header">
        <span id="ytResultsInfo" class="ly-song-list-info"></span>
        <button id="closeYtResults" class="ly-close-btn">✕ 閉じる</button>
      </div>
      <div id="ytResultCards" class="ly-yt-cards"></div>
    </div>
  </section>

  <!-- YouTube Player (hidden iframe) -->
  <div id="playerSection" class="ly-player-section" hidden>
    <div id="ytPlayer"></div>
  </div>

  <!-- Lyrics Stage -->
  <div id="stage" role="region" aria-label="歌詞表示エリア"></div>

  <!-- Control Bar -->
  <div id="controlBar" class="ly-control-bar">
    <div class="ly-ctrl-top">
      <button id="seekBackBtn"   class="ly-ctrl-btn" aria-label="-10秒" disabled>⏪</button>
      <button id="playPauseBtn" class="ly-play-btn" aria-label="再生"  disabled>▶</button>
      <button id="seekFwdBtn"    class="ly-ctrl-btn" aria-label="+10秒" disabled>⏩</button>
      <span   id="timer"        class="ly-timer">00:00</span>
      <span   id="duration"     class="ly-duration">/ --:--</span>
      <label class="ly-speed-label" for="speedSelect">速度</label>
      <select id="speedSelect" class="ly-speed-select">
        <option value="slow">ゆっくり</option>
        <option value="normal" selected>普通</option>
        <option value="fast">速い</option>
        <option value="veryfast">最速</option>
      </select>
      <label class="ly-vol-label" for="volumeSlider">🔊</label>
      <input  id="volumeSlider" class="ly-volume" type="range" min="0" max="100" value="80">
      <button id="nextSongBtn"  class="ly-next-btn" disabled>次の曲 ▶▶</button>
    </div>
    <div class="ly-ctrl-bottom">
      <input id="progressBar" class="ly-progress" type="range" min="0" max="1000" value="0" step="1">
    </div>
  </div>

  <script src="lyrics.js?v=3"></script>
</body>
</html>
