<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Case By Case — ツリーでマニュアルにたどり着く">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2e3e"/>
      <stop offset="100%" stop-color="#061019"/>
    </linearGradient>
    <linearGradient id="docm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2836"/>
      <stop offset="100%" stop-color="#0a2130"/>
    </linearGradient>
    <linearGradient id="chosenm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ff7f7"/>
      <stop offset="100%" stop-color="#3fe0e0"/>
    </linearGradient>
    <filter id="glowm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- full-bleed background for adaptive/maskable crop -->
  <rect width="512" height="512" fill="url(#bgm)"/>

  <!-- content within the center safe zone -->
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <rect x="238" y="120" width="196" height="276" rx="20" fill="#3fe0e0" opacity="0.10"/>
    <path d="M238 148 a20 20 0 0 1 20-20 h116 l58 58 v170 a20 20 0 0 1-20 20 H258 a20 20 0 0 1-20-20 Z"
          fill="url(#docm)" stroke="url(#chosenm)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M374 128 v38 a20 20 0 0 0 20 20 h38" fill="none" stroke="url(#chosenm)" stroke-width="7" stroke-linejoin="round"/>
    <rect x="272" y="212" width="104" height="16" rx="8" fill="#7ff7f7"/>
    <rect x="272" y="248" width="128" height="12" rx="6" fill="#3fe0e0" opacity="0.75"/>
    <rect x="272" y="278" width="128" height="12" rx="6" fill="#3fe0e0" opacity="0.55"/>
    <rect x="272" y="308" width="96"  height="12" rx="6" fill="#3fe0e0" opacity="0.55"/>

    <g fill="none" stroke="#3fe0e0" stroke-width="12" stroke-linecap="round" opacity="0.4">
      <path d="M96 262 V330 h60"/>
    </g>
    <circle cx="168" cy="330" r="16" fill="#061019" stroke="#3fe0e0" stroke-width="10" opacity="0.4"/>

    <path d="M96 262 V190 h150" fill="none" stroke="url(#chosenm)" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glowm)"/>
    <path d="M238 190 l-26 -15 v30 z" fill="#7ff7f7" filter="url(#glowm)"/>

    <circle cx="96" cy="288" r="30" fill="#061019" stroke="url(#chosenm)" stroke-width="12" filter="url(#glowm)"/>
    <circle cx="96" cy="288" r="11" fill="#7ff7f7"/>
    <circle cx="96" cy="190" r="14" fill="#7ff7f7"/>
  </g>
</svg>
