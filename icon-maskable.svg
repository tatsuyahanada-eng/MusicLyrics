<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Solid gradient fills the whole tile so Android adaptive
       icons can crop cleanly. Content is kept inside the central
       80% safe zone (51..461). -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Equalizer bars constrained to safe zone -->
  <g fill="#ffffff" opacity="0.38" transform="translate(0 0)">
    <rect x="110" y="222" width="18" height="68"  rx="9"/>
    <rect x="138" y="196" width="18" height="120" rx="9"/>
    <rect x="166" y="232" width="18" height="48"  rx="9"/>
    <rect x="328" y="196" width="18" height="120" rx="9"/>
    <rect x="356" y="222" width="18" height="68"  rx="9"/>
    <rect x="384" y="232" width="18" height="48"  rx="9"/>
  </g>

  <!-- Centre play disc (sized to fit safe zone) -->
  <circle cx="256" cy="256" r="104" fill="#ffffff"/>
  <circle cx="256" cy="256" r="104" fill="none" stroke="rgba(124,58,237,0.18)" stroke-width="2"/>
  <circle cx="256" cy="256" r="14"  fill="rgba(124,58,237,0.18)"/>

  <!-- Play triangle -->
  <path d="M 231 206 L 320 256 L 231 306 Z" fill="url(#play)"/>
</svg>
