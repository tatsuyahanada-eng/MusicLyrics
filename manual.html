<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a1420">
  <meta name="description" content="ケースバイケースで最適な作業項目に案内する、ツリー型のチャットボット作業マニュアル">
  <title>Case By Case — 作業マニュアル</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="manual.css?v=2">
</head>
<body class="tm-body">

  <!-- ===== Header (HUD) ===== -->
  <header class="tm-header">
    <div class="tm-header-brand">
      <span class="tm-header-logo">CASE&#8202;BY&#8202;CASE</span>
      <span class="tm-header-sub">"CASE&#215;GUIDE" 作業ナビゲーション・システム</span>
    </div>
    <nav class="tm-header-nav">
      <button id="navModeBtn" class="tm-navbtn is-active" data-mode="nav" type="button">
        <span class="tm-navbtn-ico">&#9673;</span> 案内モード
      </button>
      <button id="editModeBtn" class="tm-navbtn" data-mode="edit" type="button">
        <span class="tm-navbtn-ico">&#9881;</span> 編集モード
      </button>
    </nav>
  </header>

  <!-- ===== Breadcrumb ===== -->
  <div id="breadcrumbBar" class="tm-breadcrumb" aria-label="現在地">
    <span class="tm-crumb tm-crumb-home" data-crumb-home>TOP</span>
  </div>

  <main class="tm-main">

    <!-- ============ NAV MODE ============ -->
    <section id="navView" class="tm-view">
      <div class="tm-panel">
        <div class="tm-panel-corner tm-corner-tl"></div>
        <div class="tm-panel-corner tm-corner-tr"></div>
        <div class="tm-panel-corner tm-corner-bl"></div>
        <div class="tm-panel-corner tm-corner-br"></div>

        <div class="tm-panel-head">
          <span class="tm-panel-head-label">MEASUREMENT MODE</span>
          <span class="tm-panel-head-jp">案内モード</span>
          <span id="remainHint" class="tm-panel-head-remain"></span>
        </div>

        <!-- chat log -->
        <div id="chatLog" class="tm-chatlog" aria-live="polite"></div>

        <!-- choices dock -->
        <div id="choiceDock" class="tm-choicedock"></div>

        <!-- controls -->
        <div class="tm-navctrls">
          <button id="backBtn" class="tm-ghostbtn" type="button">&#9664; 一つ戻る</button>
          <button id="restartBtn" class="tm-ghostbtn" type="button">&#8635; 最初から</button>
        </div>
      </div>
    </section>

    <!-- ============ EDIT MODE ============ -->
    <section id="editView" class="tm-view" hidden>
      <div class="tm-panel">
        <div class="tm-panel-corner tm-corner-tl"></div>
        <div class="tm-panel-corner tm-corner-tr"></div>
        <div class="tm-panel-corner tm-corner-bl"></div>
        <div class="tm-panel-corner tm-corner-br"></div>

        <div class="tm-panel-head">
          <span class="tm-panel-head-label">EDIT MODE</span>
          <span class="tm-panel-head-jp">項目の追加・修正・保存</span>
        </div>

        <div class="tm-edit-toolbar">
          <button id="addRootBtn" class="tm-btn tm-btn-primary" type="button">&#43; 大項目（カテゴリ）を追加</button>
          <div class="tm-edit-toolbar-spacer"></div>
          <button id="exportBtn" class="tm-btn tm-btn-outline" type="button">&#8681; CSV出力</button>
          <button id="importBtn" class="tm-btn tm-btn-outline" type="button">&#8679; CSV取込</button>
          <input id="importFile" type="file" accept=".csv,text/csv" hidden>
          <button id="resetBtn" class="tm-btn tm-btn-danger-outline" type="button">初期化</button>
        </div>

        <!-- ===== Data sync (server CSV / FTP) ===== -->
        <details id="syncPanel" class="tm-sync">
          <summary class="tm-sync-summary">
            <span class="tm-sync-title">&#8646; サーバー連携（CSV / FTP）</span>
            <span id="serverStatus" class="tm-server-status is-off">サーバー未接続</span>
          </summary>
          <div class="tm-sync-body">
            <p class="tm-sync-note">
              サーバー（PHP）に <code>api.php</code> を設置すると、特定の場所のCSVファイルを読み書き・追記でき、FTPで一括更新できます。
              未設置の場合は上の「CSV出力／取込」でファイルとして管理できます。
            </p>

            <label class="tm-sync-field">
              <span class="tm-sync-field-label">APIトークン（サーバー側で設定した場合のみ）</span>
              <input id="apiToken" class="tm-input" type="password" autocomplete="off" placeholder="未設定なら空欄でOK">
            </label>

            <div class="tm-sync-group">
              <span class="tm-sync-group-label">サーバー上のCSV</span>
              <div class="tm-sync-row">
                <button id="serverLoadBtn" class="tm-btn tm-btn-outline" type="button">&#8681; サーバーから読込</button>
                <button id="serverSaveBtn" class="tm-btn tm-btn-outline" type="button">&#8679; サーバーへ保存（全体）</button>
              </div>
            </div>

            <div class="tm-sync-group">
              <span class="tm-sync-group-label">FTP（別サーバー／指定パスへ一括更新）</span>
              <div class="tm-sync-row">
                <button id="ftpPullBtn" class="tm-btn tm-btn-outline" type="button">&#8681; FTPから取得</button>
                <button id="ftpPushBtn" class="tm-btn tm-btn-outline" type="button">&#8679; FTPへ送信（一括更新）</button>
              </div>
            </div>

            <label class="tm-sync-toggle">
              <input type="checkbox" id="autoAppend">
              <span>項目を追加したら、サーバーCSVにも自動で追記する</span>
            </label>

            <p id="syncStatus" class="tm-sync-status" aria-live="polite"></p>
          </div>
        </details>

        <p id="saveStatus" class="tm-savestatus" aria-live="polite"></p>

        <div id="editTree" class="tm-edittree"></div>
      </div>
    </section>
  </main>

  <footer class="tm-footer">
    <span>&copy; Case By Case</span>
    <span id="installHint" class="tm-install" hidden>
      <button id="installBtn" class="tm-linkbtn" type="button">&#8681; アプリとしてインストール</button>
    </span>
    <span class="tm-footer-note">データはこの端末のブラウザに保存されます</span>
  </footer>

  <!-- ===== Node Edit Dialog ===== -->
  <dialog id="nodeDialog" class="tm-dialog">
    <form id="nodeForm" method="dialog" class="tm-dialog-form">
      <h2 id="nodeDialogTitle" class="tm-dialog-title">項目を編集</h2>

      <label class="tm-field">
        <span class="tm-field-label">項目名（選択肢に表示されます）</span>
        <input id="nodeTitleInput" class="tm-input" type="text" required maxlength="120"
          placeholder="例：ドミネーターが起動しない">
      </label>

      <label class="tm-field">
        <span class="tm-field-label">
          説明・作業内容（任意）
          <span class="tm-field-hint">この項目を選んだときに表示されます。最終的な作業項目にはここに手順を書きます。</span>
        </span>
        <textarea id="nodeBodyInput" class="tm-input tm-textarea" rows="8"
          placeholder="手順や案内文を入力。空行で段落、行頭「- 」で箇条書き、「# 」で見出しになります。"></textarea>
      </label>

      <div class="tm-dialog-actions">
        <button type="button" id="nodeCancelBtn" class="tm-btn tm-btn-outline">キャンセル</button>
        <button type="submit" class="tm-btn tm-btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- ===== Confirm Dialog ===== -->
  <dialog id="confirmDialog" class="tm-dialog">
    <div class="tm-dialog-form">
      <h2 id="confirmTitle" class="tm-dialog-title">確認</h2>
      <p id="confirmMsg" class="tm-confirm-msg"></p>
      <div class="tm-dialog-actions">
        <button type="button" id="confirmCancel" class="tm-btn tm-btn-outline">キャンセル</button>
        <button type="button" id="confirmOk" class="tm-btn tm-btn-danger">実行</button>
      </div>
    </div>
  </dialog>

  <script src="manual.js?v=2"></script>
</body>
</html>
