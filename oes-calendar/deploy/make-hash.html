<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者パスワードのハッシュ作成｜OES入替作業APP</title>
<style>
body{font-family:'Hiragino Sans','Noto Sans JP','Meiryo',sans-serif;background:#EAF7FD;color:#12314F;
     line-height:1.6;margin:0;padding:20px;}
.wrap{max-width:720px;margin:0 auto;background:#fff;border:1px solid #BFE9FB;border-radius:12px;padding:18px;}
h1{font-size:19px;margin:0 0 6px;}
p{font-size:14px;margin:8px 0;}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 4px;}
input,textarea{width:100%;font-size:16px;padding:9px 10px;border:1px solid #7FD4F5;border-radius:8px;
     font-family:inherit;background:#fff;color:inherit;}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;}
.note{background:#DFF5FC;border:1px solid #BFE9FB;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>管理者パスワードのハッシュ作成</h1>
  <p>PHPが使えないサーバーで <code>config.json</code> を作るためのページです。
  パスワードを入力すると、そのまま貼り付けられる <code>config.json</code> の中身が下に出ます。
  <b>このページはサーバーに置かず、手元で開いて使ってください。</b></p>

  <label for="pw">新しい管理者パスワード</label>
  <input id="pw" type="text" placeholder="例: Welsys@1234" autocomplete="off">

  <label for="out">config.json の中身（コピーして保存）</label>
  <textarea id="out" rows="4" readonly></textarea>

  <div class="note">できあがった <code>config.json</code> を <code>index.html</code> と同じ場所へFTPでアップロードすると、
  次から新しいパスワードになります。<br>
  PHPが使えるサーバーなら、この方法ではなく <code>config.php</code> にパスワードを直接書くほうが安全です
  （パスワードもハッシュもブラウザから見えません）。</div>
</div>
<script>
function sha256Hex(str){
  var K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var s = unescape(encodeURIComponent(String(str)));
  var len = s.length, bits = len * 8;
  var nWords = (((len + 8) >> 6) + 1) * 16;
  var w = new Array(nWords), i;
  for(i = 0; i < nWords; i++) w[i] = 0;
  for(i = 0; i < len; i++) w[i >> 2] |= (s.charCodeAt(i) & 0xff) << (24 - (i % 4) * 8);
  w[len >> 2] |= 0x80 << (24 - (len % 4) * 8);
  w[nWords - 2] = Math.floor(bits / 4294967296);
  w[nWords - 1] = bits >>> 0;
  var rr = function(x, n){ return (x >>> n) | (x << (32 - n)); };
  var m = new Array(64), a,b,c,d,e,f,g,h,t1,t2,j,blk;
  for(blk = 0; blk < nWords; blk += 16){
    for(j = 0; j < 16; j++) m[j] = w[blk + j];
    for(j = 16; j < 64; j++){
      var s0 = rr(m[j-15],7) ^ rr(m[j-15],18) ^ (m[j-15] >>> 3);
      var s1 = rr(m[j-2],17) ^ rr(m[j-2],19) ^ (m[j-2] >>> 10);
      m[j] = (m[j-16] + s0 + m[j-7] + s1) >>> 0;
    }
    a=H[0];b=H[1];c=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
    for(j = 0; j < 64; j++){
      var S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
      var ch = (e & f) ^ (~e & g);
      t1 = (h + S1 + ch + K[j] + m[j]) >>> 0;
      var S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
      var mj = (a & b) ^ (a & c) ^ (b & c);
      t2 = (S0 + mj) >>> 0;
      h=g; g=f; f=e; e=(d + t1) >>> 0; d=c; c=b; b=a; a=(t1 + t2) >>> 0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  var out = '';
  for(i = 0; i < 8; i++) out += ('0000000' + H[i].toString(16)).slice(-8);
  return out;
}

function update(){
  var v = document.getElementById('pw').value;
  var out = document.getElementById('out');
  if(!v){ out.value = ''; return; }
  out.value = JSON.stringify({ adminPasswordHash: sha256Hex('oes-calendar:' + v) }, null, 2);
}
document.getElementById('pw').addEventListener('input', update);
update();
</script>
</body>
</html>
